# Dedicated Week 7 stack. Invoke with --project-directory set to the repository root.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: labflow
      POSTGRES_USER: labflow
      POSTGRES_PASSWORD: week7-isolated-test-password
    volumes: ['database:/var/lib/postgresql/data']
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U labflow -d labflow']
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [labflow]
  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: labflow
      RABBITMQ_DEFAULT_PASS: week7-isolated-test-password
    ports: ['127.0.0.1:15687:15672']
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 2s
      timeout: 5s
      retries: 30
    networks: [labflow]
  backend:
    image: labflow-backend:week7-acceptance
    build: ./backend
    init: true
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/labflow
      DB_USERNAME: labflow
      DB_PASSWORD: week7-isolated-test-password
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: labflow
      RABBITMQ_PASSWORD: week7-isolated-test-password
      ARTIFACT_ROOT: /var/lib/labflow/artifacts
      WORKER_SERVICE_TOKEN: week7-isolated-worker-service-token
      AUTH_JWT_SECRET: week7-isolated-jwt-signing-secret-at-least-32-bytes
      OUTBOX_PUBLISHER_FIXED_DELAY: PT0.2S
      RECOVERY_REAPER_FIXED_DELAY: PT1S
      LOG_FORMAT: logstash
    ports: ['127.0.0.1:18087:8080']
    volumes: ['artifacts:/var/lib/labflow/artifacts']
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    networks: [labflow]
  frontend:
    image: labflow-frontend:week7-acceptance
    build: ./frontend
    ports: ['127.0.0.1:13087:8080']
    depends_on:
      backend: {condition: service_healthy}
    networks: [labflow]
  worker-a: &worker
    image: labflow-worker:week7-acceptance
    build: ./worker
    init: true
    restart: 'no'
    environment: &worker-env
      WORKER_INSTANCE_NAME: worker-a
      LABFLOW_API_URL: http://backend:8080
      LABFLOW_SERVICE_TOKEN: week7-isolated-worker-service-token
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: labflow
      RABBITMQ_PASSWORD: week7-isolated-test-password
      WORKER_IMAGE_DIGEST: labflow-worker:week7-acceptance
    volumes: ['artifacts:/var/lib/labflow/artifacts:ro']
    depends_on:
      backend: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    networks: [labflow]
  worker-b:
    <<: *worker
    environment:
      <<: *worker-env
      WORKER_INSTANCE_NAME: worker-b
volumes:
  database:
  artifacts:
networks:
  labflow:
