# Explicit configuration is required in production; local defaults stay in the base profile.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
labflow.auth.jwt.secret=${AUTH_JWT_SECRET}
labflow.auth.jwt.issuer=${AUTH_JWT_ISSUER}
labflow.worker.service-token=${WORKER_SERVICE_TOKEN}
labflow.artifacts.root=${ARTIFACT_ROOT}

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
management.endpoint.health.show-components=never
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

# Deployment policy can be stricter than the version 1 schema.
labflow.execution.max-memory-mb=${TASK_MAX_MEMORY_MB:1024}
labflow.execution.max-timeout-seconds=${TASK_MAX_TIMEOUT_SECONDS:300}
