# Application
spring.application.name=labflow-backend

# PostgreSQL DataSource
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/labflow}
spring.datasource.username=${DB_USERNAME:labflow}
spring.datasource.password=${DB_PASSWORD:labflow_dev_password}

# HikariCP connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-components=always
management.endpoint.health.show-details=always

# Authentication (override the development secret outside local environments)
labflow.auth.jwt.secret=${AUTH_JWT_SECRET:labflow-local-development-jwt-secret-change-me}
labflow.auth.jwt.issuer=${AUTH_JWT_ISSUER:https://labflow.local}
labflow.auth.jwt.ttl=${AUTH_JWT_TTL:PT1H}

# Artifact storage
labflow.artifacts.root=${ARTIFACT_ROOT:./data/artifacts}
labflow.artifacts.max-upload-size=${ARTIFACT_MAX_UPLOAD_SIZE:1MB}
spring.servlet.multipart.max-file-size=${ARTIFACT_MAX_UPLOAD_SIZE:1MB}
