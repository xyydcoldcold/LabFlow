# Application
spring.application.name=labflow-backend

# PostgreSQL DataSource
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/labflow}
spring.datasource.username=${DB_USERNAME:labflow}
spring.datasource.password=${DB_PASSWORD:labflow_dev_password}

# HikariCP connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# RabbitMQ and reliable publishing
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:labflow}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:labflow_dev_password}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=1

# Transactional outbox publisher
labflow.outbox.publisher.enabled=${OUTBOX_PUBLISHER_ENABLED:true}
labflow.outbox.publisher.fixed-delay=${OUTBOX_PUBLISHER_FIXED_DELAY:PT1S}
labflow.outbox.publisher.initial-delay=${OUTBOX_PUBLISHER_INITIAL_DELAY:PT2S}
labflow.outbox.batch-size=${OUTBOX_BATCH_SIZE:50}
labflow.outbox.confirm-timeout=${OUTBOX_CONFIRM_TIMEOUT:PT5S}
labflow.outbox.initial-backoff=${OUTBOX_INITIAL_BACKOFF:PT1S}
labflow.outbox.max-backoff=${OUTBOX_MAX_BACKOFF:PT5M}

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-components=always
management.endpoint.health.show-details=always

# Authentication (override the development secret outside local environments)
labflow.auth.jwt.secret=${AUTH_JWT_SECRET:labflow-local-development-jwt-secret-change-me}
labflow.auth.jwt.issuer=${AUTH_JWT_ISSUER:https://labflow.local}
labflow.auth.jwt.ttl=${AUTH_JWT_TTL:PT1H}

# Artifact storage
labflow.artifacts.root=${ARTIFACT_ROOT:./data/artifacts}
labflow.artifacts.max-upload-size=${ARTIFACT_MAX_UPLOAD_SIZE:1MB}
spring.servlet.multipart.max-file-size=${ARTIFACT_MAX_UPLOAD_SIZE:1MB}
